<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<style>
body{background:#0f172a;color:white;font-family:Arial}
header{background:#020617;padding:15px;text-align:center}
.container{padding:20px}
.user{background:#020617;padding:15px;border-radius:10px;margin:10px}
button{background:#ef4444;padding:6px 12px;border:none;border-radius:6px;color:white}
</style>
</head>
<body>

<header><h2>Admin Panel</h2></header>

<div class="container">
<button onclick="loadUsers()">Load Users</button>
<div id="users"></div>
</div>

<script>
async function loadUsers(){
const res = await fetch("/admin/users");
const users = await res.json();
const div = document.getElementById("users");
div.innerHTML="";
users.forEach(u=>{
div.innerHTML += `
<div class="user">
${u.username}
<form action="/admin/delete" method="POST">
<input type="hidden" name="username" value="${u.username}">
<button>Delete</button>
</form>
</div>`;
});
}
</script>

</body>
</html>
