<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>
  <h2>User Dashboard</h2>
  <p id="user"></p>

<script>
const params = new URLSearchParams(window.location.search);
const user = params.get("user");

document.getElementById("user").innerText = "Welcome " + user;
</script>
</body>
</html>
