<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - BotZone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <div><strong>BotZone Panel</strong></div>
  <div><a href="/">Home</a> <a href="login.html">Logout</a></div>
</nav>

<div class="container">
  <h1>Your Dashboard</h1>

  <h3>Instructions:</h3>
  <div class="instruction"><div class="arrow">➤</div><p>Upload your bot (.js) file below.</p></div>
  <div class="instruction"><div class="arrow">➤</div><p>Your uploaded bots will appear in the list.</p></div>
  <div class="instruction"><div class="arrow">➤</div><p>Use Start/Stop buttons to manage your bots (coming soon!).</p></div>

  <h3>Upload Bot</h3>
  <form action="/upload" method="POST" enctype="multipart/form-data">
    <input type="file" name="botfile" required>
    <button type="submit">Upload Bot</button>
  </form>

  <h3>Uploaded Bots</h3>
  <ul class="bot-list" id="botList">
    <!-- Bots will appear here -->
  </ul>
</div>

<script>
  fetch('/status')
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById('botList');
      const li = document.createElement('li');
      li.textContent = `Panel status: ${data.status}, port: ${data.port}`;
      list.appendChild(li);
    });
</script>
</body>
</html>
