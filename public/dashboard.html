<!DOCTYPE html>
<html>
<head>
<title>BotZone Panel</title>
<style>
body{
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
}
.sidebar{
  width:220px;
  height:100vh;
  background:#020617;
  position:fixed;
  padding:20px;
}
.sidebar h2{
  color:#38bdf8;
}
.sidebar p{
  margin:15px 0;
}
.main{
  margin-left:240px;
  padding:20px;
}
.card{
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
}
button{
  padding:6px 12px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.start{background:#22c55e;color:black;}
.stop{background:#ef4444;color:white;}
.upload{background:#38bdf8;color:black;}
.logbox{
  background:black;
  color:lime;
  padding:10px;
  height:200px;
  overflow:auto;
}
.arrow{
  color:#38bdf8;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="sidebar">
  <h2>BotZone</h2>
  <p>🏠 Dashboard</p>
  <p>📤 Upload Bot</p>
  <p>⚙ Manage Bots</p>
  <p>📜 Logs</p>
</div>

<div class="main">

<h2>Free Bot Hosting Panel</h2>

<div class="card">
<h3>➡ Instructions</h3>
<p class="arrow">➡ Enter your username</p>
<p class="arrow">➡ Upload bot files (index.js + package.json)</p>
<p class="arrow">➡ Click Start to run bot</p>
</div>

<div class="card">
<input id="username" placeholder="Enter username"><br><br>
<input type="file" id="files" multiple>
<button class="upload" onclick="upload()">Upload Bot</button>
</div>

<div class="card">
<h3>Your Bots</h3>
<ul id="botList"></ul>
</div>

<div class="card">
<h3>Logs</h3>
<pre class="logbox" id="logs"></pre>
</div>

</div>

<script>
async function upload(){
  const user = document.getElementById("username").value;
  const files = document.getElementById("files").files;
  const form = new FormData();

  for(let f of files) form.append("files",f);
  form.append("username",user);

  await fetch("/upload",{method:"POST",body:form});
  loadBots();
}

async function loadBots(){
  const user = document.getElementById("username").value;
  const res = await fetch("/bots/"+user);
  const bots = await res.json();

  const list = document.getElementById("botList");
  list.innerHTML="";

  bots.forEach(bot=>{
    const li=document.createElement("li");
    li.innerHTML = `
      ${bot}
      <button class="start" onclick="startBot('${bot}')">Start</button>
      <button class="stop" onclick="stopBot('${bot}')">Stop</button>
      <button onclick="viewLogs('${bot}')">Logs</button>
    `;
    list.appendChild(li);
  });
}

async function startBot(file){
  const user=document.getElementById("username").value;
  await fetch("/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user,file})});
}

async function stopBot(file){
  await fetch("/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({file})});
}

async function viewLogs(file){
  const res=await fetch("/logs/"+file);
  const text=await res.text();
  document.getElementById("logs").innerText=text;
}
</script>

</body>
</html>
