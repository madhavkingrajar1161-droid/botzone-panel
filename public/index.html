<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BotZone Host</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b1220, #020617);
      color: white;
      text-align: center;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #7dd3fc;
    }

    .nav-buttons button {
      background: transparent;
      border: 2px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 15px;
      border-radius: 25px;
      margin-left: 10px;
      cursor: pointer;
    }

    .hero {
      margin-top: 60px;
      padding: 20px;
    }

    .hero h1 {
      font-size: 42px;
      background: linear-gradient(to right, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero h2 {
      margin-top: 15px;
      font-size: 20px;
      color: #cbd5f5;
    }

    .hero p {
      margin-top: 20px;
      color: #94a3b8;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }

    .cta {
      margin-top: 40px;
    }

    .cta button {
      background: linear-gradient(to right, #6366f1, #22c55e);
      border: none;
      padding: 18px 50px;
      border-radius: 50px;
      font-size: 20px;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(99,102,241,0.6);
    }

    .features {
      margin-top: 50px;
      color: #a5b4fc;
    }

    footer {
      margin-top: 80px;
      padding: 20px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🚀 BotZoneHost</div>
  <div class="nav-buttons">
    <button onclick="location.href='login.html'">Login</button>
    <button onclick="location.href='register.html'">Menu</button>
  </div>
</header>

<div class="hero">
  <h1>Free Bot Hosting</h1>
  <h2>⚡ Discord Bots & Game Servers</h2>

  <p>
    Create powerful, lag-free Discord bots at zero cost.
    Premium performance, unlimited possibilities, completely free forever.
  </p>

  <div class="cta">
    <button onclick="location.href='register.html'">Start Your Bot</button>
  </div>

  <div class="features">
    ⚡ Discord Bot Hosting • 💻 Node.js • ☁ 24/7 Uptime
  </div>
</div>

<footer>
  © 2026 BotZoneHost — Inspired by FreeGameHost.xyz
</footer>

</body>
</html>
