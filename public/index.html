<!DOCTYPE html>
<html>
<head>
<title>BotZone Hosting</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
header{background:#020617;padding:15px;display:flex;justify-content:space-between}
a{color:#38bdf8;text-decoration:none;margin-left:15px}
.hero{text-align:center;padding:80px 20px}
.hero h1{color:#38bdf8;font-size:40px}
button{padding:12px 25px;border:none;border-radius:8px;margin:10px;font-size:16px;cursor:pointer}
.login{background:#38bdf8}
.register{background:#22c55e}
.steps{display:flex;justify-content:center;gap:30px;margin:60px;flex-wrap:wrap}
.step{background:#020617;padding:20px;border-radius:12px;width:200px}
.arrow{font-size:40px;margin-top:60px}
footer{text-align:center;padding:15px;background:#020617}
</style>
</head>
<body>

<header>
<h2>BotZone</h2>
<div>
<a href="/login">Login</a>
<a href="/register">Register</a>
</div>
</header>

<div class="hero">
<h1>Free Discord Bot Hosting</h1>
<p>Host your Discord bots 24/7 for free</p>
<button class="login" onclick="location.href='/login'">Login</button>
<button class="register" onclick="location.href='/register'">Register</button>
</div>

<div class="steps">
<div class="step"><h3>1️⃣ Create Bot</h3><p>Create bot on Discord.</p></div>
<div class="arrow">➡️</div>
<div class="step"><h3>2️⃣ Upload Files</h3><p>Upload your bot files.</p></div>
<div class="arrow">➡️</div>
<div class="step"><h3>3️⃣ Run 24/7</h3><p>Start and keep online.</p></div>
</div>

<footer>© BotZone Panel</footer>
</body>
</html>
