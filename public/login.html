<!DOCTYPE html>
<html>
<head>
  <title>Login - BotZone</title>
</head>
<body>
  <h2>Login</h2>

  <form id="loginForm">
    <input id="username" placeholder="Username" required><br><br>
    <input id="password" type="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
  </form>

  <p id="msg"></p>

<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", async function(e){
  e.preventDefault(); // VERY IMPORTANT

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ username, password })
  });

  const text = await res.text();

  if (text.trim() === "Login successful") {
    window.location.href = "dashboard.html?user=" + username;
  } else {
    msg.innerText = text;
  }
});
</script>
</body>
</html>
