<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{background:#0f172a;color:white;font-family:Arial}
.box{background:#020617;padding:30px;border-radius:12px;width:300px;margin:100px auto;text-align:center}
input{width:90%;padding:10px;margin:10px;border-radius:6px;border:none}
button{background:#38bdf8;padding:10px 20px;border:none;border-radius:8px;cursor:pointer}
a{color:#38bdf8}
</style>
</head>
<body>
<div class="box">
<h2>Login</h2>
<form action="/login" method="POST">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p><a href="/register">Register</a></p>
</div>
</body>
</html>
